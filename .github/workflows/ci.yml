name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same three platforms the release builds for. A sheet parser that
        # only ever runs on the maintainer's Mac is a sheet parser nobody has
        # tested on the platform most vSphere administrators use.
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the frontend parses
        run: node --check src/main.js

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # The sheet tests run against captured vCenter responses and need no
      # network. This proves the headless exporter at least starts and can
      # enumerate its sheets on every platform.
      - name: Smoke-test the headless exporter
        working-directory: src-tauri
        run: cargo run --bin invar-export -- --list-sheets

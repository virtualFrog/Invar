<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STTools</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-text">
            <strong>STTools</strong>
            <small>VCF Operations</small>
          </span>
        </div>
        <p class="nav-heading">Inventory</p>
        <nav id="sheet-nav" class="nav"></nav>
        <div class="sidebar-footer">
          <button id="export" class="primary">Export XLSX</button>
          <button id="report" class="ghost">Topology Report</button>
          <button id="open-settings" class="ghost">Settings</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div class="titles">
            <h1 id="sheet-title">vInfo</h1>
            <p id="status" class="status"></p>
          </div>
          <div class="actions">
            <input id="filter" type="search" placeholder="Filter rows…" autocomplete="off" />
            <button id="refresh" class="primary">Refresh</button>
          </div>
        </header>

        <div id="warnings" class="warnings" hidden></div>

        <div id="dashboard" class="dashboard" hidden></div>

        <div id="table-wrap" class="table-wrap">
          <table id="table">
            <thead><tr id="head-row"></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
      </main>
    </div>

    <dialog id="settings">
      <form method="dialog">
        <h2>vCenter connections</h2>
        <p class="hint">
          Credentials are stored in this app's config directory, readable only by
          your user account.
        </p>
        <div id="connections"></div>
        <div class="dialog-actions">
          <button id="add-connection" type="button" class="ghost">Add vCenter</button>
          <span class="spacer"></span>
          <button value="cancel" class="ghost">Cancel</button>
          <button id="save-settings" type="button" class="primary">Save</button>
        </div>
        <p id="settings-status" class="status"></p>
      </form>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>

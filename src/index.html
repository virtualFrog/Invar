<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vCenter Inventory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>vCenter Inventory</h1>
      <nav id="sheet-nav">
        <button class="sheet-tab active" data-sheet="vInfo">vInfo</button>
      </nav>
      <div class="header-actions">
        <input id="filter" type="search" placeholder="Filter rows…" autocomplete="off" />
        <button id="refresh">Refresh</button>
        <button id="open-settings">Settings</button>
      </div>
    </header>

    <main>
      <p id="status" class="status"></p>
      <div id="warnings" class="warnings" hidden></div>
      <div id="table-wrap" class="table-wrap">
        <table id="table">
          <thead><tr id="head-row"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </main>

    <dialog id="settings">
      <form method="dialog">
        <h2>vCenter connections</h2>
        <p class="hint">
          Credentials are stored in this app's config directory, readable only by
          your user account.
        </p>
        <div id="connections"></div>
        <div class="dialog-actions">
          <button id="add-connection" type="button">Add vCenter</button>
          <span class="spacer"></span>
          <button value="cancel">Cancel</button>
          <button id="save-settings" type="button" class="primary">Save</button>
        </div>
        <p id="settings-status" class="status"></p>
      </form>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
